## Configuration file for a typical i2pd user
## See https://i2pd.readthedocs.org/en/latest/configuration.html
## for more options you can use in this file.

# log = file
# logfile = ./i2pd.log
loglevel = none

## hardened profile: never route traffic for others (transit tunnels
## reveal your router's long-lived identity) and stay off floodfill duty
notransit = true
floodfill = false

ipv4 = true
ipv6 = false

bandwidth = O

[limits]
transittunnels = 0

[precomputation]
elgamal = false

[upnp]
enabled = false
name = I2Pd

[reseed]
verify = true

[http]
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444

[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447

[sam]
enabled = true
address = 127.0.0.1
port = 7656
